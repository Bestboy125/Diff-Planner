# Safe defaults. The launch script must explicitly override auth_token.
bind_host: 0.0.0.0
port: 50051
allowed_host_ips:
  - 192.168.5.2
live_publish_enabled: false
preview_only_mode: true
planning_preview_enabled: false
operator_task_enabled: false
world_frame: world
body_frame: base_link
camera_frame: camera_color_optical_frame
expected_calibration_id: REQUIRED
max_source_observation_age_ms: 1000
max_ttl_ms: 2000
max_goal_step_m: 1.0
max_operator_yaw_rad: 1.5708
takeoff_height_m: 1.0
min_goal_z_m: 0.1
max_goal_z_m: 2.0
max_odom_age_ms: 250
watchdog_timeout_ms: 1000
max_message_bytes: 65536
socket_timeout_sec: 2.0
